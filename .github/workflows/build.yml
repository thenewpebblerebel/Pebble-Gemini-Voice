name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Python2 Docker image
        run: |
          docker build --platform linux/amd64 -f Dockerfile.py2 -t pebble-tool:ci_py2 .

      - name: Debug runner and container
        run: |
          echo "Runner uname:"; uname -a
          echo "Runner arch:"; uname -m
          echo "Docker version:"; docker version --format '{{json .Server}}' || docker version
          echo "Container uname:"; docker run --rm pebble-tool:ci_py2 uname -a || true
          echo "Container python:"; docker run --rm pebble-tool:ci_py2 python --version || true
          echo "Check pebble file:"; docker run --rm pebble-tool:ci_py2 file /usr/local/bin/pebble || true

      - name: Run pebble build inside Python2 container
        run: |
          docker run --rm -v "${{ github.workspace }}":/src -w /src pebble-tool:ci_py2 /bin/bash -lc 'python /usr/local/bin/pebble build'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pebble-build
          path: |
            build/**
            *.pbw
            build/*
