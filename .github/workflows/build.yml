name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. SDK Lobotomy (Proven to work)
              pebble build || true
              REPORT_PY=\$(find /home/pebble/.pebble-sdk -name 'report_memory_usage.py')
              printf \"def generate_memory_usage_report(task_gen):\\n    return\\n\" > \"\$REPORT_PY\"
              
              # 2. Workspace Setup
              chown -R 1000:1000 . /home/pebble/.pebble-sdk
              
              # 3. THE TWO-STAGE PUNCH
              # Stage A: Generate the auto-file
              su pebble -c 'pebble build' || true
              
              # Stage B: Bridge the gap physically (The Signature Killer)
              if [ -f build/basalt/appinfo.auto.c ]; then
                cp build/basalt/appinfo.auto.c build/appinfo.auto.c
                echo 'Physical bridge created for appinfo.auto.c'
              fi
              
              # Stage C: Complete the build
              # We do NOT run clean. We let it resume and see our copied file.
              su pebble -c 'pebble build'
              
              # 4. Export for Artifacts
              cp build/basalt/*.pbw . 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
