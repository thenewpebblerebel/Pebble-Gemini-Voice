name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. FORCE UNPACK (Wait for it to finish or fail)
              pebble build || true
              
              # 2. THE NUCLEAR FIX: Empty the broken file so it can't throw TypeErrors
              # We don't just edit it; we overwrite it with a 'return' statement
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec bash -c \"echo 'def generate_memory_usage_report(task_gen): return' > {}\" \;
              
              # 3. FIXED PATH MAPPING: Force the SDK to look in basalt/
              find /home/pebble/.pebble-sdk -name 'pebble_sdk_lib.py' -exec sed -i \"s|ctx.path.find_or_declare('appinfo.auto.c')|ctx.path.find_or_declare('basalt/appinfo.auto.c')|g\" {} +
              
              # 4. WORKSPACE & PERMISSIONS
              mkdir -p /inner_pebble && cp -r . /inner_pebble
              chown -R 1000:1000 /inner_pebble /home/pebble/.pebble-sdk
              chmod -R 777 /inner_pebble /home/pebble/.pebble-sdk
              
              # 5. THE CLEAN BUILD
              # We avoid 'pebble clean' here to prevent the SDK from resetting its tools
              cd /inner_pebble && su pebble -c 'pebble build'
              
              # 6. EXPORT
              cp /inner_pebble/build/basalt/*.pbw /pebble/ 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
