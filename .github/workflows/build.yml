name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip build-essential git

      - name: Install Pebble SDK
        run: |
          pip3 install --upgrade pip
          pip3 install pebble-tool

      - name: Build Pebble app
        run: |
          pebble build

      - name: Check build output
        if: always()
        run: |
          echo "--- build directory ---"
          ls -lah build/ || echo "No build dir"
          echo "--- pbw files ---"
          find . -name "*.pbw" -o -name "*.elf" || echo "No binaries found"

      - name: Upload Pebble App Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-App-Package
          path: build/*.pbw


