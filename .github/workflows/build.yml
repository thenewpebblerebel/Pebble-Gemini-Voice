name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. THE REBBLE SECRET: Disable the memory reporter via ENV
              # This stops the broken code from running without changing a single file
              export PEBBLE_SKIP_MEMORY_REPORT=1
              
              # 2. FORCE UNPACK & PERMISSIONS
              pebble build || true
              chown -R 1000:1000 . /home/pebble/.pebble-sdk
              
              # 3. THE TWO-STAGE PHYSICAL BRIDGE
              # Stage A: Generate the auto-file (will stop at 73% due to path bug)
              su pebble -c 'export PEBBLE_SKIP_MEMORY_REPORT=1 && pebble build' || true
              
              # Stage B: Create the physical bridge for Task 8
              if [ -f build/basalt/appinfo.auto.c ]; then
                cp build/basalt/appinfo.auto.c build/appinfo.auto.c
                echo 'Physical bridge created for appinfo.auto.c'
              fi
              
              # Stage C: Resume and Finish
              # The SDK now sees the file in the root and will finish Tasks 9-15
              su pebble -c 'export PEBBLE_SKIP_MEMORY_REPORT=1 && pebble build'
              
              # 4. EXPORT THE RESULT
              cp build/basalt/*.pbw . 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
