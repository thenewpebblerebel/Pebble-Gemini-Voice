name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. Force SDK Unpack
              pebble build || true
              
              # 2. THE KILL SWITCH: Rename the broken script
              # By renaming it, we prevent Waf from ever importing/running it.
              # This bypasses the TypeError AND the inspect.py crash.
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec mv {} {}.broken \;
              
              # 3. THE PATH BRIDGE
              # Create a dummy file in the root build folder to satisfy the Task 8 signature
              mkdir -p build/basalt
              touch build/appinfo.auto.c
              
              # 4. PERMISSIONS
              chown -R 1000:1000 . /home/pebble/.pebble-sdk
              
              # 5. THE FINAL ATTEMPT
              # We use '|| true' on the first run to generate the real auto-file, 
              # then copy it and run once more to finish.
              su pebble -c 'pebble build' || true
              cp build/basalt/appinfo.auto.c build/appinfo.auto.c 2>/dev/null || true
              su pebble -c 'pebble build'
              
              # 6. EXPORT
              cp build/basalt/*.pbw . 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
