name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. Force SDK to unpack its hidden tools
              pebble build || true
              
              # 2. THE TOTAL GHOST KILLER
              # We find EVERY report_memory_usage.py and disable the logic globally
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i 's/max_resources=/#max_resources=/g' {} +
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i 's/print \"Memory usage/#print \"Memory usage/g' {} +
              
              # 3. THE PATH LOCK
              # Force all internal scripts to look in the basalt subfolder
              find /home/pebble/.pebble-sdk -name '*.py' -exec sed -i \"s|find_or_declare('appinfo.auto.c')|find_or_declare('basalt/appinfo.auto.c')|g\" {} +
              
              # 4. WORKSPACE SETUP
              mkdir -p /inner_pebble && cp -r . /inner_pebble
              chown -R 1000:1000 /inner_pebble /home/pebble/.pebble-sdk
              chmod -R 777 /inner_pebble /home/pebble/.pebble-sdk
              
              # 5. THE BUILD (Identity switch)
              cd /inner_pebble && su pebble -c 'pebble build'
              
              # 6. EXPORT THE PRIZE
              cp /inner_pebble/build/basalt/*.pbw /pebble/ 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
