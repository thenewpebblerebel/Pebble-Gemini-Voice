name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        # We add --user root so the container can clean up old build files
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            ghcr.io/skylord123/docker-coredevices-pebble-tool:latest \
            /bin/bash -c "pebble build && chown -R 1001:1001 /pebble"

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          # The modern image puts the .pbw in the build/ folder
          path: "build/*.pbw"
