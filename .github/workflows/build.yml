name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. Surgical SDK Fixes (Comment out the broken memory code)
              pebble build || true
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i 's/max_resources=/#max_resources=/g' {} +
              
              # 2. THE SECRET SAUCE: Symlink the expected path to the actual path
              # This satisfies Waf's 'Node Signature' without changing the SDK source
              mkdir -p build/basalt
              touch build/appinfo.auto.c
              ln -sf /pebble/build/appinfo.auto.c /pebble/build/basalt/appinfo.auto.c
              
              # 3. Setup Permissions
              chown -R 1000:1000 . /home/pebble/.pebble-sdk
              chmod -R 777 . /home/pebble/.pebble-sdk
              
              # 4. RUN BUILD AS PEBBLE USER
              # We use --debug to see exactly why it stops if it fails again
              su pebble -c 'pebble build --debug'
              
              # 5. Clean up for GitHub
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "build/*.pbw"
