name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean build artifacts
        run: |
          rm -rf build .waf* .lock-waf*

      - name: Build Pebble App
        run: |
          docker run --rm --user root --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            rebble/pebble-sdk \
            bash -c "find /root/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i '39,60d' {} \; && pebble build"

      - name: Check build output
        if: always()
        run: |
          echo "--- build directory ---"
          ls -lah build/ || echo "No build dir"
          echo "--- pbw files ---"
          find . -name "*.pbw" || echo "No pbw files"

      - name: Upload Pebble App Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-App-Package
          path: build/*.pbw



