name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean build artifacts
        run: |
          rm -rf build .waf* .lock-waf*

      - name: Build with Rebble SDK
        run: |
          docker run --rm --user root -v "${{ github.workspace }}":/pebble -w /pebble rebble/pebble-sdk /bin/bash -c "
            pebble clean &&
            (pebble build || (
              find /root/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i '39,60d' {} \; &&
              pebble clean &&
              pebble build
            )) || (
              ln -sf basalt/appinfo.auto.c build/appinfo.auto.c 2>/dev/null &&
              pebble build
            )
          "

      - name: Check build output
        if: always()
        run: |
          echo "--- build directory ---"
          ls -lah build/ || echo "No build dir"
          echo "--- pbw files ---"
          find . -name "*.pbw" || echo "No pbw files"

      - name: Upload Pebble App Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-App-Package
          path: build/*.pbw



