name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. Unpack SDK
              pebble build || true
              
              # 2. Workspace setup
              mkdir -p /inner_pebble && cp -r . /inner_pebble
              
              # 3. THE SURGERY: Force the SDK to look in the basalt subfolder
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i '39,60d' {} +
              find /home/pebble/.pebble-sdk -name 'pebble_sdk_lib.py' -exec sed -i \"s|ctx.path.find_or_declare('appinfo.auto.c')|ctx.path.find_or_declare('basalt/appinfo.auto.c')|g\" {} +
              
              # 4. Unlock permissions for the pebble user
              chown -R 1000:1000 /inner_pebble /home/pebble/.pebble-sdk
              chmod -R 777 /inner_pebble /home/pebble/.pebble-sdk
              
              # 5. THE FINAL BUILD
              cd /inner_pebble && su pebble -c 'pebble build'
              
              # 6. Export the prize
              cp /inner_pebble/build/basalt/*.pbw /pebble/ 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
