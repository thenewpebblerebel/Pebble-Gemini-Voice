name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Python2 Docker image
        run: |
          docker build --platform linux/amd64 -f Dockerfile.py2 -t pebble-tool:ci_py2 .

      - name: Debug runner and container
        run: |
          echo "Runner uname:"; uname -a
          echo "Runner arch:"; uname -m
          echo "Docker version:"; docker version --format '{{json .Server}}' || docker version
          echo "Image inspect:"; docker image inspect pebble-tool:ci_py2 --format '{{.Architecture}} {{.Os}} {{.Variant}}' || true
          echo "Container uname:"; docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 uname -a || true
          echo "Container python:"; docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 python --version || true
          echo "List /usr/local/bin:"; docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 ls -l /usr/local/bin || true
          echo "Check pebble file:"; docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 sh -c 'file /usr/local/bin/pebble || echo "file command missing"' || true

      - name: Copy files from image and inspect on runner
        run: |
          container=$(docker create --platform=linux/amd64 pebble-tool:ci_py2)
          docker cp "$container":/usr/local/bin/pebble ./pebble_from_image || true
          docker cp "$container":/usr/local/bin/python ./python_from_image || true
          docker cp "$container":/bin/uname ./uname_from_image || true
          docker cp "$container":/bin/ls ./ls_from_image || true
          docker rm "$container" || true
          echo "--- file outputs ---"
          file ./pebble_from_image || true
          file ./python_from_image || true
          file ./uname_from_image || true
          file ./ls_from_image || true
          echo "--- first lines of pebble_from_image ---"
          sed -n '1,8p' ./pebble_from_image | sed -n l || true
          echo "--- hexdump (64 bytes) of pebble_from_image ---"
          (hexdump -n 64 -C ./pebble_from_image || xxd -l 64 ./pebble_from_image || true)

      - name: Run pebble build inside Python2 container
        run: |
          docker run --rm --platform=linux/amd64 -v "${{ github.workspace }}":/src -w /src pebble-tool:ci_py2 /usr/local/bin/pebble build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pebble-build
          path: |
            build/**
            *.pbw
            build/*
