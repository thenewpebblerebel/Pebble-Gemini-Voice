name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update PATH
        run: echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Build Python2 Docker image
        run: |
          docker build --platform linux/amd64 -f Dockerfile.py2 -t pebble-tool:ci_py2 .

      - name: Debug runner and container
        run: |
          echo "Runner uname:"; uname -a
          echo "Runner arch:"; uname -m
          echo "Docker version:"; docker version --format '{{json .Server}}' || docker version
          echo "Image inspect:"; docker image inspect pebble-tool:ci_py2 --format '{{.Architecture}} {{.Os}} {{.Variant}}' || true
          echo "Container uname:"; docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 uname -a || true
          echo "Container python:"; docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 python --version || true
          echo "List /usr/local/bin:"; docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 ls -l /usr/local/bin || true
          echo "Check pebble file:"; docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 sh -c 'file /usr/local/bin/pebble || echo "file command missing"' || true

      - name: Copy files from image and inspect on runner
        run: |
          container=$(docker create --platform=linux/amd64 pebble-tool:ci_py2)
          docker cp "$container":/usr/local/bin/pebble ./pebble_from_image || true
          docker cp "$container":/usr/local/bin/python ./python_from_image || true
          docker cp "$container":/usr/bin/python2.7 ./python2_7_from_image || true
          docker cp "$container":/usr/bin/python2 ./python2_from_image || true
          docker cp "$container":/bin/uname ./uname_from_image || true
          docker cp "$container":/bin/ls ./ls_from_image || true
          docker cp "$container":/lib64/ld-linux-x86-64.so.2 ./ld_linux_from_image || true
          docker cp "$container":/lib/ld-linux-x86-64.so.2 ./ld_linux_alt_from_image || true
          docker rm "$container" || true
          echo "--- file outputs ---"
          file ./pebble_from_image || true
          file ./python_from_image || true
          file ./python2_7_from_image || true
          file ./python2_from_image || true
          file ./ld_linux_from_image || true
          file ./ld_linux_alt_from_image || true
          file ./uname_from_image || true
          file ./ls_from_image || true
          echo "--- first lines of pebble_from_image ---"
          sed -n '1,8p' ./pebble_from_image | sed -n l || true
          echo "--- hexdump (64 bytes) of pebble_from_image ---"
          (hexdump -n 64 -C ./pebble_from_image || xxd -l 64 ./pebble_from_image || true)
          echo "--- python readlink and ldd ---"
          if [ -e ./python_from_image ]; then readlink -f ./python_from_image || true; ldd ./python_from_image || true; fi
          if [ -e ./python2_7_from_image ]; then readlink -f ./python2_7_from_image || true; ldd ./python2_7_from_image || true; fi
          if [ -e ./python2_from_image ]; then readlink -f ./python2_from_image || true; ldd ./python2_from_image || true; fi
          if [ -e ./ld_linux_from_image ]; then readlink -f ./ld_linux_from_image || true; ldd ./ld_linux_from_image || true; fi
          if [ -e ./ld_linux_alt_from_image ]; then readlink -f ./ld_linux_alt_from_image || true; ldd ./ld_linux_alt_from_image || true; fi

      - name: Verify pebble script shebang
        run: |
          echo "--- pebble script shebang (first line) ---"
          docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 head -n 1 /usr/local/bin/pebble || true
          echo "--- file info for pebble ---"
          docker run --rm --platform=linux/amd64 pebble-tool:ci_py2 file /usr/local/bin/pebble || true

      - name: Run pebble build inside Python2 container
        run: |
          docker run --rm --platform=linux/amd64 -v "${{ github.workspace }}":/src -w /src pebble-tool:ci_py2 /usr/local/bin/pebble build || true
          echo "--- build dir listing ---"
          ls -lah build || true
          echo "--- matching pbw files ---"
          ls -lah build/*.pbw || true

      - name: Force Diagnostics (always)
        if: always()
        run: |
          echo "Running diagnostics inside container and saving to /src/debug_log.txt"
          docker run --rm --platform=linux/amd64 -v "${{ github.workspace }}":/src -w /src pebble-tool:ci_py2 sh -c '{ \
            echo "--- ls /usr/local/bin/python ---"; \
            ls -l /usr/local/bin/python || true; \
            echo "--- file /usr/local/bin/python ---"; \
            file /usr/local/bin/python || true; \
            echo "--- ldd /usr/local/bin/python ---"; \
            ldd /usr/local/bin/python || true; \
            echo "--- pebble build --debug ---"; \
            /usr/local/bin/pebble build --debug || true; \
          } > /src/debug_log.txt 2>&1'

      - name: Upload Pebble App Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-App-Package
          path: |
            build/*.pbw

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Debug-Log
          path: debug_log.txt
