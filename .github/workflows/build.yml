name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Rebble SDK
        run: |
          docker run --rm --user root -v "${{ github.workspace }}":/pebble -w /pebble rebble/pebble-sdk pebble build

      - name: Upload Pebble App Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-App-Package
          path: build/*.pbw



