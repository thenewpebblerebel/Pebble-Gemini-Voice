name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. Force SDK to unpack
              pebble build || true
              
              # 2. THE LOBOTOMY: Completely neutralize the memory reporter logic.
              # This replaces the whole function body with 'return', bypassing ALL TypeErrors.
              REPORT_PY=\$(find /home/pebble/.pebble-sdk -name 'report_memory_usage.py')
              printf \"def generate_memory_usage_report(task_gen):\\n    return\\n\" > \"\$REPORT_PY\"
              
              # 3. THE PATH ALIGNMENT: Match the 'Basalt' folder structure globally
              find /home/pebble/.pebble-sdk -name '*.py' -exec sed -i \"s|find_or_declare('appinfo.auto.c')|find_or_declare('basalt/appinfo.auto.c')|g\" {} +
              
              # 4. Permissions Reset
              chown -R 1000:1000 . /home/pebble/.pebble-sdk
              chmod -R 777 . /home/pebble/.pebble-sdk
              
              # 5. FINAL CLEAN BUILD (No 'pebble clean' to avoid SDK self-repair)
              # We run as root first to ensure the basalt folder exists
              mkdir -p build/basalt
              su pebble -c 'pebble build'
              
              # 6. Export for Artifacts
              cp build/basalt/*.pbw . 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
