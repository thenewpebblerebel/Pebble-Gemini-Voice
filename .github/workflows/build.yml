name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean build artifacts
        run: |
          rm -rf build .waf* .lock-waf*

      - name: Create placeholder to fix WAF node signature bug
        run: |
          mkdir -p build && touch build/appinfo.auto.c

      - name: Build custom Pebble SDK image with memory reporter fix
        run: |
          docker build --platform linux/amd64 -t pebble-sdk-patched .

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            pebble-sdk-patched \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # Clean start
              pebble clean
              
              # First build - will fail with memory reporter error
              pebble build 2>&1 || true
              
              # Patch memory reporter
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i '39,60d' {} \;
              
              # Second build - will fail at task 11/15 with missing node signature
              pebble build 2>&1 || true
              
              # Create symlink to fix WAF node tracking
              if [ -f build/basalt/appinfo.auto.c ]; then
                ln -sf basalt/appinfo.auto.c build/appinfo.auto.c
              fi
              
              # Third build - should complete
              pebble build
            "

      - name: Check build output
        if: always()
        run: |
          echo "--- build directory ---"
          ls -lah build/ || echo "No build dir"
          echo "--- pbw files ---"
          find . -name "*.pbw" || echo "No pbw files"

      - name: Upload Pebble App Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-App-Package
          path: build/*.pbw



