name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        # This modern image has the 'pebble' tool and SDK already pre-configured for modern Linux
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            ghcr.io/skylord123/docker-coredevices-pebble-tool:latest \
            pebble build

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App-${{ github.sha }}
          # The modern image puts the .pbw in the build/ folder by default
          path: "build/*.pbw"
