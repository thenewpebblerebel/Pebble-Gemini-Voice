- name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # Step 1: Force unpack
              pebble build || true
              
              # Step 2: Setup Workspace
              mkdir -p /inner_pebble && cp -r . /inner_pebble
              chown -R pebble:pebble /inner_pebble
              
              # Step 3: THE COMBO MOVE
              # We patch and build in one single 'su' command so nothing can reset
              su pebble -c \"
                cd /inner_pebble && \
                find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i '39,60d' {} + && \
                find /home/pebble/.pebble-sdk -name 'pebble_sdk_lib.py' -exec sed -i \\\"s|ctx.path.find_or_declare('appinfo.auto.c')|ctx.path.find_or_declare(ctx.env.BUILD_DIR).find_or_declare('appinfo.auto.c')|g\\\" {} + && \
                pebble build
              \"
              
              # Step 4: Export the result
              cp /inner_pebble/build/basalt/*.pbw /pebble/ 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "
