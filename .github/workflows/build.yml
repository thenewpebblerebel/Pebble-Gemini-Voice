name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Python2 Docker image
        run: |
          docker build --platform linux/amd64 -f Dockerfile.py2 -t pebble-tool:ci_py2 .

      - name: Fix permissions
        run: chmod -R 777 .

      - name: Run pebble build inside Docker
        run: |
          docker run --rm --user root --platform linux/amd64 -v "${{ github.workspace }}":/src -w /src pebble-tool:ci_py2 python2.7 /usr/local/bin/pebble build
          echo "--- Contents of build/ directory ---"
          ls -R build/ || echo "No build directory created"

      - name: Check build output
        if: always()
        run: |
          echo "--- build directory ---"
          ls -lah build/ || echo "No build dir"
          echo "--- pbw files ---"
          find . -name "*.pbw" || echo "No pbw files"

      - name: Upload Pebble App Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-App-Package
          path: build/*.pbw



