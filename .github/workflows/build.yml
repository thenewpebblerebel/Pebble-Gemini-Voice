name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. Force SDK Unpack
              pebble build || true
              
              # 2. Permissions Handover
              chown -R 1000:1000 . /home/pebble/.pebble-sdk
              
              # 3. Pass 1: Generate Metadata
              # We use a dirty trick: '|| true' because we know Task 8 will fail the signature check.
              # We use export to attempt to suppress the memory reporter logic.
              su pebble -c 'export PEBBLE_SKIP_MEMORY_REPORT=1 && pebble build' || true
              
              # 4. Bridge the Gap (Task 8 Fix)
              # Physically copy the generated file from basalt to the root build folder.
              # This satisfies the hardcoded dependency for the next pass.
              if [ -f build/basalt/appinfo.auto.c ]; then
                cp build/basalt/appinfo.auto.c build/appinfo.auto.c
                echo 'Bridged appinfo.auto.c to root build directory.'
              fi
              
              # 5. Pass 2: The Resume Build
              # Because the metadata file is now where the compiler expects it, 
              # and we are NOT running 'pebble clean', the DAG will resume from Task 8.
              su pebble -c 'export PEBBLE_SKIP_MEMORY_REPORT=1 && pebble build'
              
              # 6. Export and Ownership fix
              cp build/basalt/*.pbw . 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
