name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # 1. Force unpack
              pebble build || true
              
              # 2. THE SURGERY
              # Remove existing bytecode
              find /home/pebble/.pebble-sdk -name '*.pyc' -delete
              
              # Patch A: Early return using 4 spaces (The Python 2.7 Standard)
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i '39i\    return' {} +
              
              # Patch B: Double-tap the path mismatch
              find /home/pebble/.pebble-sdk -name 'pebble_sdk_lib.py' -exec sed -i \"s|find_or_declare('appinfo.auto.c')|find_or_declare('basalt/appinfo.auto.c')|g\" {} +
              find /home/pebble/.pebble-sdk -name 'pebble_sdk.py' -exec sed -i \"s|find_or_declare('appinfo.auto.c')|find_or_declare('basalt/appinfo.auto.c')|g\" {} +
              
              # 3. Workspace setup
              mkdir -p /inner_pebble && cp -r . /inner_pebble
              chown -R 1000:1000 /inner_pebble /home/pebble/.pebble-sdk
              chmod -R 777 /inner_pebble /home/pebble/.pebble-sdk
              
              # 4. THE CLEAN BUILD
              cd /inner_pebble && su pebble -c 'pebble build'
              
              # 5. Export prize
              cp /inner_pebble/build/basalt/*.pbw /pebble/ 2>/dev/null || echo 'No PBW found'
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
