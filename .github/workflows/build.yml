name: Build Pebble app

on:
  push:
    branches: [ main, fix/pyserial-docker ]
  pull_request:
    branches: [ main, fix/pyserial-docker ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Pebble App
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/pebble \
            -w /pebble \
            --user root \
            bboehmke/pebble-dev:latest \
            /bin/bash -c "
              export HOME=/home/pebble
              export PATH=/home/pebble/.pebble-sdk/SDKs/current/bin:\$PATH
              
              # Step 1: Force SDK to unpack
              pebble build || true
              
              # Step 2: Surgical SDK Patching
              find /home/pebble/.pebble-sdk -name 'report_memory_usage.py' -exec sed -i '39,60d' {} +
              find /home/pebble/.pebble-sdk -name 'pebble_sdk_lib.py' -exec sed -i \"s|ctx.path.find_or_declare('appinfo.auto.c')|ctx.path.find_or_declare(ctx.env.BUILD_DIR).find_or_declare('appinfo.auto.c')|g\" {} +
              
              # Step 3: Setup Internal Workspace (User ID 1000 for pebble)
              mkdir -p /inner_pebble && cp -r . /inner_pebble
              chown -R 1000:1000 /inner_pebble && chmod -R 777 /inner_pebble
              
              # Step 4: Final Build using 'su'
              su pebble -c 'cd /inner_pebble && pebble clean && pebble build'
              
              # Step 5: Export the prize
              cp /inner_pebble/build/basalt/*.pbw /pebble/ 2>/dev/null || echo 'No PBW found'
              
              # Step 6: Fix ownership for GitHub (User 1001)
              chown -R 1001:1001 /pebble
            "

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Pebble-Gemini-Voice-App
          path: "*.pbw"
